name: Deploy site

# Builds momlaunchpad-admin and rsyncs dist/ to the server for nginx (momlaunchpad.com).
# The job succeeds when rsync completes — nginx smoke checks are advisory only.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WEB_ROOT: /var/www/momlaunchpad.com

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint

      - name: Write production env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail

          if [ -z "${ENV_FILE:-}" ]; then
            echo "::error::ENV_FILE is empty. Add the production .env contents under Settings → Secrets → Actions (or the production environment)."
            exit 1
          fi

          printf '%s\n' "$ENV_FILE" > .env
          chmod 600 .env
          echo "Wrote .env ($(wc -c < .env) bytes) — Vite bakes VITE_* vars at build time"

      - name: Build for production
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          if [ -z "${HOST:-}" ]; then
            echo "::error::SSH_HOST is empty. Add it under Settings → Secrets → Actions (or the production environment)."
            exit 1
          fi
          if [ -z "${USER:-}" ]; then
            echo "::error::SSH_USERNAME is empty."
            exit 1
          fi
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY is empty."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -lf ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY is not a valid private key (check newlines when pasting the secret)."
            exit 1
          fi

          if ! ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::ssh-keyscan failed for $HOST — check SSH_HOST and server reachability on port 22."
            exit 1
          fi

          {
            echo 'Host deploy'
            echo "  HostName ${HOST}"
            echo "  User ${USER}"
            echo '  IdentityFile ~/.ssh/deploy_key'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to server (rsync)
        id: deploy
        env:
          WEB_ROOT: ${{ env.WEB_ROOT }}
        run: |
          set -euo pipefail

          ssh deploy "mkdir -p '${WEB_ROOT}'"
          rsync -avz --delete -e ssh dist/ "deploy:${WEB_ROOT}/"

          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "✅ Site files published to ${WEB_ROOT}"

      - name: Post-deploy smoke check (optional)
        if: steps.deploy.outputs.deployed == 'true'
        continue-on-error: true
        run: |
          CODE=$(ssh deploy "curl -fsS -o /dev/null -w '%{http_code}' -H 'Host: momlaunchpad.com' http://127.0.0.1/" 2>/dev/null || echo "000")
          if [ "$CODE" = "200" ]; then
            echo "Homepage OK via local nginx (HTTP 200)"
          else
            echo "::notice::Smoke check returned HTTP ${CODE} on the server. The rsync deploy succeeded — confirm nginx vhost momlaunchpad.com if needed."
          fi
